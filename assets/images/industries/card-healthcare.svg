<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="hc-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#hc-bg)" />
  
  <!-- Clinical Grid & Heartbeat Monitor Pulse Line -->
  <path d="M0 120 L80 120 L95 80 L110 160 L125 100 L140 130 L155 120 L400 120" stroke="url(#hc-glow)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M0 120 L80 120 L95 80 L110 160 L125 100 L140 130 L155 120 L400 120" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Medical Cross / Stethoscope Vector Overlay -->
  <g transform="translate(260, 30)" opacity="0.25">
    <rect x="40" y="0" width="30" height="90" rx="6" fill="#ffffff" />
    <rect x="10" y="30" width="90" height="30" rx="6" fill="#ffffff" />
  </g>
  <circle cx="320" cy="120" r="45" stroke="rgba(255,255,255,0.15)" stroke-width="2" fill="none" />
  <circle cx="320" cy="120" r="70" stroke="rgba(56,189,248,0.2)" stroke-width="1" stroke-dasharray="6 6" fill="none" />
</svg>
